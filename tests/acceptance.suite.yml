# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
step_decorators: ~
modules:
  enabled:
    - WebDriver:
        host: host.docker.internal
        port: 4444
        url: http://host.docker.internal/
        window_size: false # disabled in ChromeDriver
        browser: chrome
        capabilities:
          chromeOptions:
            args: [ "--headless", "--disable-gpu" ] # Run Chrome in headless mode
            prefs:
              download.default_directory: "..."
    - \Helper\Acceptance
# No Recorder extension: it screenshots every step of every test. On failure the
# WebDriver module already saves <test>.fail.png and .fail.html to tests/_output.