name: Test Neo-Transposer

on: [push]

env:
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_ENV: testing
  NT_DB_HOST: host.docker.internal
  NT_DB_USER: root
  NT_DB_PASSWORD: root
  NT_DB_DATABASE: nt_only_songs
  NT_DB_DATABASE_INTEGRATION: nt_empty_tables
  NT_DEBUG: 1
  NT_ADMIN_USERNAME: unused
  NT_ADMIN_PASSWORD: unused
  NT_ANALYTICS_ID: UA-xxxxxxxx-1
  NT_MAXMIND_LICENSE_KEY: ${{ secrets.NT_MAXMIND_LICENSE_KEY }}
  REGISTRY: ghcr.io
  # Xdebug's develop/debug modes slow every PHP process (Pint 18s -> 3s, plus Apache
  # in acceptance tests). Nothing in CI needs it.
  XDEBUG_MODE: 'off'

jobs:
  test-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `docker buildx build` in a run: step doesn't see the runtime token the
      # type=gha cache needs, so without this the cache is silently never read or written.
      - name: 🐳 Expose GitHub runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      # Backgrounded so MySQL boots and the ~1.5 GB Selenium image downloads while
      # Docker is building, instead of on the critical path. wait-db/wait-selenium
      # block on them later. Runner keeps the process alive until the job ends.
      - name: ⚙ Boot fixture containers in the background
        run: (make start-db-container && make start-selenium) > fixtures.log 2>&1 &

      # Fallback for update_mmdb.sh when MaxMind's download fails (e.g. daily limit reached).
      - name: 🌍 Restore the last GeoLite2 database
        uses: actions/cache@v4
        with:
          path: GeoLite2-Country.mmdb
          key: geolite2-${{ github.run_id }}
          restore-keys: geolite2-

      - name: 📦 Build the DEV Docker image
        env:
          DOCKER_BUILD: docker buildx build --load
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=dev
            --cache-to=type=gha,mode=max,scope=dev
        run: make build-dev

      # Built while the checks and tests run; it's only pushed once they pass.
      - name: 📦 Build the PROD Docker image in the background
        env:
          UPDATE_MMDB: 'true'
          DOCKER_BUILD: docker buildx build --load
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=prod
            --cache-from=type=gha,scope=dev
            --cache-to=type=gha,mode=max,scope=prod
        run: (make build-prod; echo $? > prod-build.exit) > prod-build.log 2>&1 &

      - name: ⚙ Initialise the test DB and start the app
        run: |
          make init-test-db
          make start

      - name: 🗄 create_tables.sql includes every migration
        run: make check-migrations
      - name: 🧹 Code style (Laravel Pint)
        run: make lint
      - name: 🔎 Static analysis (PHPStan)
        run: make analyse

      # Both suites in parallel (they don't touch the same songs), logs printed one after the other.
      - name: 🧪 Unit & integration tests ∥ acceptance tests
        run: |
          make test-unit > unit.log 2>&1 & unit=$!
          make test-acceptance > acceptance.log 2>&1 & acceptance=$!
          u=0; wait $unit || u=$?
          a=0; wait $acceptance || a=$?
          echo "===== Unit & integration (exit $u)"; cat unit.log
          echo "===== Acceptance (exit $a)"; cat acceptance.log
          [ $u -eq 0 ] && [ $a -eq 0 ]

      - name: 🧪 Functional test (all transpositions)
        run: make test-transpositions

      - name: 📝 Get tests' outputs
        if: always()
        run: make get-test-outputs dest=.

      - name: Show fixture containers' boot log
        if: failure()
        run: cat fixtures.log

      - name: Upload tests' outputs as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Codeception-outputs
          path: _output

      - name: 📦 Wait for the PROD Docker image
        run: |
          while [ ! -f prod-build.exit ]; do sleep 1; done
          cat prod-build.log
          exit "$(cat prod-build.exit)"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload to GitHub's container repository
        run: |
          docker tag transposer:prod ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ github.sha }}-prod
          docker push ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ github.sha }}-prod

      # Scans the image already in the local daemon rather than the ghcr reference,
      # which would pull back down the image we just pushed.
      - name: 🕵️ Run Trivy vulnerability scanner against the Prod image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transposer:prod
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: 🕵️ Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'


