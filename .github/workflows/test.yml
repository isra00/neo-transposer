name: Test Neo-Transposer

on: [push]

env:
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_ENV: testing
  NT_DB_HOST: host.docker.internal
  NT_DB_USER: root
  NT_DB_PASSWORD: root
  NT_DB_DATABASE: nt_only_songs
  NT_DB_DATABASE_INTEGRATION: nt_empty_tables
  NT_DEBUG: 1
  NT_ADMIN_USERNAME: unused
  NT_ADMIN_PASSWORD: unused
  NT_ANALYTICS_ID: UA-xxxxxxxx-1
  NT_MAXMIND_LICENSE_KEY: ${{ secrets.NT_MAXMIND_LICENSE_KEY }}
  REGISTRY: ghcr.io

jobs:
  test-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Started before the build so MySQL boots and the ~1.5 GB Selenium image
      # downloads while Docker is building, instead of on the critical path after it.
      - name: ⚙ Boot fixture containers in the background
        run: |
          make start-db-container
          make start-selenium

      - name: 📦 Build the DEV Docker image
        env:
          DOCKER_BUILD: docker buildx build --load
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=dev
            --cache-to=type=gha,mode=max,scope=dev
        run: make build-dev

      - name: ⚙ Initialise the test DB and start the app
        run: |
          make init-test-db
          make start

      - name: 🧹 Code style (Laravel Pint)
        run: make lint
      - name: 🔎 Static analysis (PHPStan)
        run: make analyse

      - name: 🧪 Unit & integration tests, functional test
        run: make test

      - name: 🧪 Acceptance tests
        run: make test-acceptance

      - name: 📝 Get tests' outputs
        if: always()
        run: make get-test-outputs dest=.

      - name: Upload tests' outputs as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Codeception-outputs
          path: _output

      - name: 📦 Build the PROD Docker image
        env:
          DOCKER_BUILD: docker buildx build --load
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=prod
            --cache-from=type=gha,scope=dev
            --cache-to=type=gha,mode=max,scope=prod
        run: make build-prod

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload to GitHub's container repository
        run: |
          docker tag transposer:prod ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ github.sha }}-prod
          docker push ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ github.sha }}-prod

      # Scans the image already in the local daemon rather than the ghcr reference,
      # which would pull back down the image we just pushed.
      - name: 🕵️ Run Trivy vulnerability scanner against the Prod image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transposer:prod
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: 🕵️ Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Fix code coverage paths
        run: sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace/@g' ./_output/coverage.xml

